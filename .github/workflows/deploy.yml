name: Deploy to Server on Merge to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Execute Production Deployment
    runs-on: ubuntu-latest

    # Connect GitHub Environment
    environment: Production

    steps:
      - name: Verify Required Secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || \
             [ -z "$SERVER_USER" ] || \
             [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::Missing Production Environment secrets."
            exit 1
          fi

          echo "All required secrets are available."

      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            TARGET_DIR="/var/www/endessusshipping"

            echo "Deploying to ${TARGET_DIR}"

            cd "${TARGET_DIR}"

            chmod +x scripts/deploy.sh

            echo "Starting deployment on main..."

            ./scripts/deploy.sh main

            echo "Deployment completed successfully."
