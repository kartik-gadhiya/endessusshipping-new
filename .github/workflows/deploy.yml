name: Deploy to Server on Merge to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Execute Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Verify Required Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "::error::Missing deployment secrets! Please configure SERVER_HOST, SERVER_USER, and SERVER_SSH_KEY in your GitHub Repository Settings (Settings -> Secrets and variables -> Actions)."
            echo "Refer to DEPLOYMENT.md for setup instructions."
            exit 1
          fi

      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: TARGET_BRANCH
          script: |
            TARGET_DIR="${{ secrets.SERVER_TARGET_DIR || '/opt/homebrew/var/www/endessusshipping-new' }}"
            echo "Navigating to project directory: ${TARGET_DIR}"
            cd "${TARGET_DIR}" || { echo "Directory ${TARGET_DIR} not found on server"; exit 1; }

            chmod +x scripts/deploy.sh
            chmod +x scripts/send-deployment-email.mjs

            echo "Executing deploy.sh on branch main..."
            ./scripts/deploy.sh main
