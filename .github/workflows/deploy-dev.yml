name: Deploy Development Environment on Push to Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Execute Development Deployment
    runs-on: ubuntu-latest

    # Connect GitHub Environment for secrets
    environment: Production

    steps:
      - name: Verify Required Secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || \
             [ -z "$SERVER_USER" ] || \
             [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::Missing Required Deployment secrets."
            exit 1
          fi

          echo "All required secrets are available."

      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            TARGET_DIR="/var/www/endessusshipping-dev"

            echo "Deploying to development directory: ${TARGET_DIR}"

            cd "${TARGET_DIR}"

            git config --global --add safe.directory "${TARGET_DIR}" 2>/dev/null || true

            chmod +x scripts/deploy.sh

            echo "Starting deployment on dev..."

            ./scripts/deploy.sh dev

            echo "Development deployment completed successfully."
